name: Save Slow Glow images in repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-images.yml'
      - 'scripts/vendor_images.py'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify studio images
        run: python3 scripts/vendor_images.py
      - name: Commit website images and replace remote URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git commit -m "Host Slow Glow images directly in the repository"
          git push origin HEAD:main
